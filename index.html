<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plaklarım">
  <title>Plaklarım</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Plaklarım</span>
    </a>
    <div class="top-actions">
      <a href="#/bulut" id="cloudBtn" class="icon-btn cloud" aria-label="İnternette saklama" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.4 9.2 4.7 4.7 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </a>
      <button id="menuBtn" class="icon-btn" aria-label="Menü" aria-haspopup="true">⋮</button>
    </div>
    <div id="menu" class="menu" hidden>
      <a href="#/bulut" class="menu-item" data-action="cloud">İnternette saklama</a>
      <button data-action="reader">Kapak okuma ayarı</button>
      <button data-action="export">Yedeği indir</button>
      <label class="menu-item" id="importItem">Yedekten geri yükle
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </label>
    </div>
    <a href="#/bulut" id="cloudLine" class="cloud-line" hidden></a>
  </header>

  <main id="view"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="db.js"></script>
  <script src="buyuk-harf.js"></script>
  <script src="buyuk-harf-v1.js"></script>
  <script src="katman.js"></script>
  <script src="kirpma.js"></script>
  <script src="kapak-okuma.js"></script>
  <script src="internetten-bilgi.js"></script>
  <script src="bulut.js"></script>
  <script src="app.js"></script>
</body>
</html>
